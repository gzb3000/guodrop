name: lan_share
description: 跨平台 WiFi 局域网文件传输工具 — 组播发现 + HTTP 传输 + 扫码直连
publish_to: 'none'
version: 0.2.0+2002

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # HTTP 服务端（接收文件）+ 客户端（发送文件）
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  http: ^1.2.2

  # 二维码生成与扫描
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # 设备信息 / 网络信息 / 路径
  device_info_plus: ^10.1.2
  network_info_plus: ^5.0.3
  # 路径
  path_provider: ^2.1.4
  path: ^1.9.0

  # 本地持久化（别名、接收目录、自动接收开关）
  shared_preferences: ^2.3.2

  # 文件选择（桌面 + 移动统一 API）
  file_picker: ^8.1.2

  # 权限申请
  permission_handler: ^11.3.1

  # 工具
  uuid: ^4.5.1
  mime: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
